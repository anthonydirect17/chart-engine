<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="live.css">
<link rel="stylesheet" href="pin.css">
<link rel="stylesheet" href="workspace.css">
</head>
<body>
<!-- The trading workspace: panels on a 12 x 6 snap grid, one window per screen, each with its own layout
     (?layout=Main, ?layout=Second). Served by ChartBridge next to the standalone page (index.html). -->
<header class="ws-top">
  <span class="ws-title">TRADING SCREEN</span>
  <span class="ws-conn wait" id="wsConn" role="status"><span class="ws-dot" aria-hidden="true">●</span> <span id="wsConnText">CONNECTING · ChartBridge</span></span>
  <span class="ws-clock"><span id="wsClock">--:--:--</span> <span class="ws-et">ET</span></span>
  <span class="ws-note" id="wsNote" role="status" hidden></span>
  <span class="ws-fill"></span>
  <!-- E2: the window's Flatten button goes in this slot (nothing here yet). -->
  <span class="ws-slot" id="wsFlattenSlot" data-slot="flatten"></span>
  <label class="ws-lbl" for="wsLayout">Layout</label>
  <select class="ws-sel" id="wsLayout"></select>
  <button type="button" class="ws-btn add" id="wsAdd" aria-haspopup="menu" aria-expanded="false" aria-controls="wsAddMenu">+ Add panel</button>
  <button type="button" class="ws-btn ws-gear" id="wsSet" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="wsSettings">⚙</button>
</header>

<main class="ws-grid" id="wsGrid" aria-label="Workspace panels">
  <div class="ws-ghost" id="wsGhost" hidden></div>
</main>

<div class="ws-pop ws-menu" id="wsAddMenu" role="menu" aria-label="Add panel" hidden>
  <button type="button" role="menuitem" data-add="chart">Chart</button>
  <button type="button" role="menuitem" data-add="tape">Time and Sales</button>
</div>

<div class="ws-pop ws-settings" id="wsSettings" role="dialog" aria-label="Settings" hidden>
  <section class="ws-sec">
    <h2>Large prints <span>Time and Sales, contracts</span></h2>
    <p class="ws-help">A trade this size or bigger is highlighted. RTH is 09:30 to 16:15 ET.</p>
    <div id="wsFloors"></div>
  </section>
  <section class="ws-sec">
    <h2>Layout</h2>
    <button type="button" class="ws-btn" id="wsReset">Reset "<span id="wsResetName"></span>" to the default</button>
  </section>
  <p class="ws-ver" id="wsVersion"></p>
</div>

<div class="ws-pop ws-settings ws-gearpop" id="wsGear" role="dialog" aria-label="Large prints" hidden>
  <section class="ws-sec"><h2>Large prints <span>contracts</span></h2><div id="wsGearBody"></div>
  <p class="ws-help">RTH is 09:30 to 16:15 ET. All floors are in Settings.</p></section>
</div>

<dialog class="ws-dialog" id="wsDialog"></dialog>

<script src="../src/chart-engine.js"></script>
<script src="bar-builder.js"></script>
<script src="order-ticket.js"></script>
<!-- ChartBridge's PIN (0.3.2): this page is served by ChartBridge like the standalone page, so it unlocks the same way. -->
<script src="pin.js"></script>
<script src="live.js"></script>
<script src="workspace.js"></script>
</body>
</html>
