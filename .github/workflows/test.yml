name: test
# A push to a branch with a pull request already runs as pull_request, so a push runs only on main (the per-PC
# updater reads the checks of main's commits). This halves the Actions minutes a pull request uses.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    # Linux and Windows (Anthony trades on Windows; the merge rule wants both green)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repo keeps no package-lock.json (by rule), so `npm ci` cannot run; install the one dev dependency
      # without writing a lock file. No browsers are downloaded: `npm test` needs none.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      # Markup Studio's server is Python (stdlib + numpy): its unit tests, on both systems
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m unittest discover -s test -p "test_markup*.py"
